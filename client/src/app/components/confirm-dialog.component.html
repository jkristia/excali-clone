@if (request(); as req) {
    <div class="overlay" (click)="cancel()">
        <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"
             (click)="$event.stopPropagation()">
            <h2 class="dialog-title" id="confirm-title">{{ req.title }}</h2>
            <p class="dialog-message">{{ req.message }}</p>
            <div class="dialog-actions">
                @if (!req.alertOnly) {
                    <button class="btn btn-secondary" type="button" (click)="cancel()">
                        {{ req.cancelLabel ?? 'Cancel' }}
                    </button>
                }
                <button class="btn" type="button" autofocus
                        [class.btn-danger]="req.danger" [class.btn-primary]="!req.danger" (click)="confirm()">
                    {{ req.confirmLabel ?? 'OK' }}
                </button>
            </div>
        </div>
    </div>
}
