@if (shape(); as shape) {
    @if (shape.type === 'text') {
        <textarea
            #ta
            class="inline-editor text"
            spellcheck="false"
            [value]="shape.text"
            (input)="onChangeText(shape, $event)"
            (blur)="commit(shape)"
            (keydown)="onKeyDown($event, shape)"
            [style.left.px]="pos().x"
            [style.top.px]="pos().y"
            style="position:absolute; transform-origin: top left;"
            [style.transform]="transform()"
            [style.font]="shape.fontSize + 'px Inter, system-ui, sans-serif'"
            [style.line-height]="lineHeight"
            [style.color]="shape.color"
            [style.text-align]="shape.textAlign"
            [style.width.px]="shape.wrap ? shape.w : Math.max(40, shape.w + 8)"
        ></textarea>
    } @else if (shape.type === 'note') {
        <textarea
            #ta
            class="inline-editor note"
            spellcheck="false"
            [value]="shape.text"
            (input)="onChangeNote(shape, $event)"
            (blur)="commit(shape)"
            (keydown)="onKeyDown($event, shape)"
            [style.left.px]="pos().x"
            [style.top.px]="pos().y"
            style="position:absolute; transform-origin: top left;"
            [style.transform]="transform()"
            [style.width.px]="shape.w"
            [style.height.px]="shape.h"
            [style.padding-top.px]="noteTop()"
            [style.font-size.px]="shape.fontSize"
            [style.text-align]="shape.textAlign"
            [style.background]="shape.fill"
        ></textarea>
    } @else if (box(); as box) {
        <textarea
            #ta
            class="inline-editor label"
            spellcheck="false"
            [value]="shape.label ?? ''"
            (input)="onChangeLabel(shape, $event)"
            (blur)="commit(shape)"
            (keydown)="onKeyDown($event, shape)"
            [style.left.px]="pos().x"
            [style.top.px]="pos().y"
            style="position:absolute; transform-origin: top left; background:transparent;"
            [style.transform]="transform()"
            [style.width.px]="box.w"
            [style.height.px]="box.h"
            [style.padding-top.px]="labelTop()"
            [style.padding-left.px]="labelPadding"
            [style.padding-right.px]="labelPadding"
            [style.text-align]="labelAlign()"
            [style.font]="labelFontSize() + 'px Inter, system-ui, sans-serif'"
        ></textarea>
    }
}
