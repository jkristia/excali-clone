<button class="menu-btn" type="button" title="Menu" [class.active]="open()" (click)="toggle()">
    <app-burger-icon />
</button>

@if (open()) {
    <div class="menu-dropdown" role="menu">
        @for (item of items(); track item.label) {
            <button class="menu-item" type="button" role="menuitem" (click)="item.action()">
                @switch (item.icon) {
                    @case ('open') {
                        <svg class="menu-item-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        </svg>
                    }
                    @case ('save') {
                        <svg class="menu-item-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                            <path d="M17 21v-8H7v8" />
                            <path d="M7 3v5h8" />
                        </svg>
                    }
                    @case ('download') {
                        <svg class="menu-item-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                            <path d="M12 3v12" />
                            <path d="M7 10l5 5 5-5" />
                            <path d="M5 21h14" />
                        </svg>
                    }
                }
                <span class="menu-item-label">{{ item.label }}</span>
                @if (item.shortcut) {
                    <span class="menu-item-shortcut">{{ item.shortcut }}</span>
                }
            </button>
        }
    </div>
}

<input #fileInput class="file-input" type="file" accept="application/json,.json" (change)="onFileChosen($event)" />
